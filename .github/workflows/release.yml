name: Release Actape

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actape-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS universal
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Build release archive
        run: |
          xcodebuild archive \
            -project Actape.xcodeproj \
            -scheme Actape \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Actape.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
      - name: Sign and package
        run: |
          APP="$RUNNER_TEMP/Actape.xcarchive/Products/Applications/Actape.app"
          codesign --force --deep --options runtime \
            --entitlements Actape.entitlements --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" \
            "$RUNNER_TEMP/Actape-macOS-${GITHUB_REF_NAME}-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/Actape-macOS-${{ github.ref_name }}-universal.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish Windows/Actape.Windows/Actape.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o ./out/windows
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/package | Out-Null
          Copy-Item ./out/windows/Actape.exe ./out/package/Actape.exe
          Copy-Item Windows/README.md ./out/package/使用说明.md
          Copy-Item LICENSE ./out/package/LICENSE
          Compress-Archive -Path ./out/package/* -DestinationPath "./out/Actape-Windows-$env:GITHUB_REF_NAME-win-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/Actape-Windows-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum "Actape-macOS-${GITHUB_REF_NAME}-universal.zip" \
            "Actape-Windows-${GITHUB_REF_NAME}-win-x64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Actape $TAG" \
              --notes-file docs/RELEASE_NOTES_v1.0.0.md --latest
          else
            gh release create "$TAG" dist/* \
              --verify-tag --title "Actape $TAG" \
              --notes-file docs/RELEASE_NOTES_v1.0.0.md --latest
          fi
