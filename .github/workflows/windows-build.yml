name: Build Windows Actape

on:
  push:
    branches: [main, feature/windows-native, feature/preserve-coordinates-key-input]
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          dotnet publish Windows/Actape.Windows/Actape.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./out/windows
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./out/package | Out-Null
          Copy-Item ./out/windows/Actape.exe ./out/package/Actape.exe
          Copy-Item Windows/README.md ./out/package/使用说明.md
          Compress-Archive -Path ./out/package/* -DestinationPath ./out/Actape-Windows-preview-win-x64.zip -Force
      - name: Upload preview artifact (no automatic public release)
        uses: actions/upload-artifact@v4
        with:
          name: Actape-Windows-win-x64
          path: ./out/Actape-Windows-preview-win-x64.zip
          if-no-files-found: error
